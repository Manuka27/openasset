name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feature/**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CHECKPOINT_DISABLE: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: openasset_test
          POSTGRES_USER: openasset_ci
          POSTGRES_PASSWORD: openasset-ci-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U openasset_ci -d openasset_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Prisma Client and validate schema
        run: |
          npx --no-install prisma generate
          npx --no-install prisma validate

      - name: TypeScript
        run: |
          npx --no-install next typegen
          npx --no-install tsc --noEmit --incremental false

      - name: ESLint
        run: npm run lint -- --no-cache

      - name: Production build
        run: npm run build

      - name: Migrate the disposable database and run all tests
        env:
          DATABASE_URL: postgresql://openasset_ci:openasset-ci-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/openasset_test
          PORT: '3100'
          OPENASSET_TEST_URL: http://127.0.0.1:3100
          BETTER_AUTH_URL: https://127.0.0.1:3100
        run: |
          npm run db:migrate
          export TEST_DATABASE_URL="$DATABASE_URL"
          BETTER_AUTH_SECRET=$(openssl rand -hex 32)
          printf '::add-mask::%s\n' "$BETTER_AUTH_SECRET"
          export BETTER_AUTH_SECRET

          setsid npm start -- --hostname 127.0.0.1 > "$RUNNER_TEMP/openasset-next.log" 2>&1 &
          server_pid=$!
          cleanup() {
            kill -TERM -- "-$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --max-time 2 "$OPENASSET_TEST_URL/login" >/dev/null; then
              npm test
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          echo "OpenAsset did not serve the login page on the CI port." >&2
          exit 1
