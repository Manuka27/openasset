services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: openasset
      POSTGRES_USER: openasset
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - openasset-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openasset -d openasset"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  openasset-db:
